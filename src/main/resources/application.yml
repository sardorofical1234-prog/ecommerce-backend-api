logging:
  structured:
    format:
      console: logstash

spring:
  application:
    name: ecommerce-backend-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce_db}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:local-development-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  security:
    jwt:
      issuer: ecommerce-backend-api
      secret-base64: ${JWT_SECRET_BASE64:}
      access-token-ttl: 15m
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Store Administrator}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    backend: ${RATE_LIMIT_BACKEND:memory}
    window: 1m
    auth-requests: 20
    checkout-requests: 10
    payment-requests: 10
  observability:
    prometheus-token: ${METRICS_SCRAPE_TOKEN:}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
