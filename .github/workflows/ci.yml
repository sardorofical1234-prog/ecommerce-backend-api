name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Docker is available for Testcontainers
        run: docker info
      - name: Verify
        run: mvn -B verify
      - name: Prepare isolated Docker Compose environment
        shell: bash
        run: |
          umask 077
          {
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "RATE_LIMIT_BACKEND=redis"
            echo "JWT_SECRET_BASE64=$(openssl rand -base64 32 | tr -d '\n')"
            echo "BOOTSTRAP_ADMIN_ENABLED=true"
            echo "BOOTSTRAP_ADMIN_EMAIL=smoke-admin@example.com"
            echo "BOOTSTRAP_ADMIN_PASSWORD=smoke-admin-password-2026"
            echo 'BOOTSTRAP_ADMIN_FULL_NAME="Compose Smoke Admin"'
          } > .env
      - name: Build and start Docker Compose services
        run: docker compose up --build -d
      - name: Exercise the running API over HTTP
        run: ./scripts/compose-smoke-test.sh
      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v --remove-orphans

  publish-image:
    name: Publish versioned container image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and publish release image
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must follow semantic versioning, for example v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA:0:12}"

          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$SHA_TAG" \
            .

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$SHA_TAG"

          if [[ ! "$VERSION" =~ - ]]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

          echo "Published container image: $IMAGE:$VERSION"
          echo "Commit-addressed tag: $IMAGE:$SHA_TAG"
